name: Check and deploy fund rebalancer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: fund-rebalance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check calculation and input invariants
        run: npm run test:unit
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Assemble public site
        run: |
          mkdir -p build/pages
          cp -R index.html manifest.webmanifest manifest-dark.webmanifest service-worker.js styles src icons LICENSE .nojekyll build/pages/
      - name: Check the public site in browsers
        run: SITE_ROOT=build/pages npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fund-rebalance-playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked site
        id: deployment
        uses: actions/deploy-pages@v5
